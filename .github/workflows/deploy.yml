name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service to deploy'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

jobs:
  deploy:
    # TODO(lsd-runner): confirm install path with maintainer.
    #
    # `lsd` (Lifestream Dynamics deploy CLI) is a Go binary that needs:
    #   1. SSH access to mittonvillage.com (operator key)
    #   2. lsd-vault decryption material (age identity) to render secrets
    #   3. The lsd binary itself on PATH
    #   4. ~/.config/lsd/config.yaml pointing at a ledger directory
    #
    # The source repo (~/Projects/lifestream-deploy) has no public remote and
    # no published release artifacts, so ubuntu-latest cannot `curl | sh` or
    # `go install` it. The intended deploy host is the operator's laptop.
    #
    # Recommended: register a self-hosted runner (label `lsd`) on a machine
    # that already has `lsd`, `~/.ssh/config` for mittonvillage.com, and the
    # lsd-vault identity wired up. Then change `runs-on` to:
    #     runs-on: [self-hosted, lsd]
    # Until that runner exists this workflow will fail fast on the
    # "Verify lsd available" step rather than half-deploying.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify lsd available
        # Fails loudly if the runner does not have `lsd` installed. The new
        # deploy path is `lsd deploy crossword-{backend,frontend}` — we will
        # not fall back to the retired SSH+pm2 path.
        run: |
          if ! command -v lsd >/dev/null 2>&1; then
            echo "::error::lsd CLI not found on PATH. Configure a self-hosted runner with lsd installed (see TODO in this file)."
            exit 1
          fi
          lsd --version

      - name: Deploy backend
        if: ${{ github.event_name == 'push' || inputs.service == 'both' || inputs.service == 'backend' }}
        run: lsd deploy crossword-backend
        env:
          # Vault unlock material. Configure in repo Settings → Secrets:
          #   LSD_VAULT_HOST  — e.g. mittonvillage.com
          #   LSD_VAULT_TOKEN — vault agent token (if the runner is not pre-authed)
          LSD_VAULT_HOST: ${{ secrets.LSD_VAULT_HOST }}
          LSD_VAULT_TOKEN: ${{ secrets.LSD_VAULT_TOKEN }}

      - name: Deploy frontend
        if: ${{ github.event_name == 'push' || inputs.service == 'both' || inputs.service == 'frontend' }}
        run: lsd deploy crossword-frontend
        env:
          LSD_VAULT_HOST: ${{ secrets.LSD_VAULT_HOST }}
          LSD_VAULT_TOKEN: ${{ secrets.LSD_VAULT_TOKEN }}

      - name: Verify backend health
        if: ${{ github.event_name == 'push' || inputs.service == 'both' || inputs.service == 'backend' }}
        # URL matches backend/deploy.yaml `health.url`.
        run: curl -fsS https://crossword.mittonvillage.com/api/health

      - name: Verify frontend
        if: ${{ github.event_name == 'push' || inputs.service == 'both' || inputs.service == 'frontend' }}
        # URL matches frontend/deploy.yaml `health.url`.
        run: curl -fsS https://crossword.mittonvillage.com/
